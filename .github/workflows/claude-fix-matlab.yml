name: Claude fixes MATLAB files

on:
  push:
    branches: [main]
    paths:
      - '**/*.m'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review the MATLAB (.m) files changed in the latest push.
            Fix syntax errors, logic errors, and missing semicolons or
            labels that would stop the code from running correctly.
            Do not change the intended behavior or rewrite working code.
            Commit your fixes to main with a short message describing each
            change. Push them.
